<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form & Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0;
            padding: 30px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid;
            padding: 5px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Detail Form </h2>
        <form id="detailForm">
            <label>ID</label>
            <input type="text" placeholder="Enter your id" id="id">

            <label>Name</label>
            <input type="text" placeholder="Enter your name" id="name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email" id="email">
            <button type="submit">Submit</button>
        </form>

        <h2>Entered Details</h2>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>deletebutton</th>
                </tr>
            </thead>
            <tbody id="accountsTable"></tbody>
        </table>


    </div>

</body>

<script>
    document.getElementById('detailForm').addEventListener('submit',postData);
    function postData(event) {
        event.preventDefault();
        const id = document.getElementById('id').value;
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        fetch('/users/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id: id, name: name, email: email })
        })
        .then(response => {
            if(response.ok){
                fetchdata();
            }
        })
    }



    
    function fetchdata() {
        fetch('/users')
            .then(response => response.json())
            .then(users => {
                const table = document.getElementById('accountsTable');
                table.innerHTML = '';

                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                   
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td> 
                        <td>
                            <button type="delete" onclick="deletedata(${user.id})">Delete</button>
                        </td>
                    `;
                    table.appendChild(tr);
                });
            });
    }
    fetchdata();
    function deletedata(id) {
        fetch(`/users/delete/${id}`, {
            method: 'DELETE'
        })
        .then(response => {
            if(response.ok){
                fetchdata();
            }
        })
    }





</script>

</html>
